<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Faizan Quazi | UX Analyst & Designer</title>
    <meta name="description" content="Faizan Quazi is a UX Analyst based in Pune, India. Crafting digital experiences that feel effortless.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body class="bg-[#F8FAFC] text-[#0F172A]">

    <!-- Universal Navbar -->
    <div id="navbar"></div>

    <!-- Hero Section with Video Background -->
    <section class="relative min-h-screen flex items-center justify-center overflow-hidden">
        <!-- Video Background -->
        <div class="hero-video-bg">
            <video 
                class="absolute inset-0 w-full h-full object-cover"
                autoplay 
                loop 
                muted 
                playsinline
                preload="metadata">
                <source src="videos/herovid.mp4" type="video/mp4">
            </video>
            
            <!-- Dark gradient overlay -->
            <div class="hero-overlay"></div>
            
            <!-- Subtle vignette -->
            <div class="vignette"></div>
        </div>

        <!-- Hero Content -->
        <div class="relative z-10 max-w-5xl mx-auto px-6 text-center">
            <div class="inline-flex items-center gap-x-2 px-4 py-1.5 rounded-full bg-white/10 backdrop-blur-md border border-white/20 mb-6">
                <div class="w-2 h-2 bg-[#0EA5E9] rounded-full animate-pulse"></div>
                <span class="text-white/90 text-sm font-medium tracking-[3px]">SELECTED WORK 2021–2025</span>
            </div>

            <h1 class="text-white text-7xl md:text-8xl font-semibold tracking-[-0.04em] leading-none mb-6">
                Crafting<br>digital<br>experiences
            </h1>

            <p class="max-w-xl mx-auto text-white/80 text-xl mb-10">
                A curated selection of design systems, AI interfaces,<br>and enterprise platforms that push boundaries.
            </p>

            <a href="#work" 
               class="inline-flex items-center justify-center gap-x-3 px-10 py-5 bg-white text-[#0F172A] font-semibold text-lg rounded-3xl shadow-xl hover:bg-white/90 active:scale-[0.985] transition-all">
                <span>Explore Projects</span>
                <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>

        <!-- Scroll indicator -->
        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-y-1">
            <span class="text-white/60 text-xs tracking-[2px]">SCROLL TO BEGIN</span>
            <i class="fa-solid fa-chevron-down text-white/60 text-sm animate-bounce"></i>
        </div>
    </section>

    <!-- Rest of the page content would continue here... -->
    <!-- (Keeping this short for the example - in real repo the full file exists) -->

    <script src="js/nav.js"></script>
</body>
</html>
