<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work | Faizan Quazi</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        }

        .section-heading {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            letter-spacing: -0.04em;
        }

        .project-card {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .project-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 40px 70px -20px rgb(14 165 233 / 0.25);
        }

        .carousel-container {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 60px -15px rgb(0 0 0 / 0.25);
            border: 1px solid #e2e8f0;
        }

        .filter-tab {
            transition: all 0.3s ease;
        }
        .filter-tab.active {
            background-color: #0EA5E9;
            color: white;
            box-shadow: 0 10px 15px -3px rgb(14 165 233 / 0.3);
        }
    </style>
</head>
<body class="bg-[#F8FAFC] text-[#0F172A] font-sans">

    <!-- Universal Navbar Placeholder -->
    <div id="navbar"></div>

    <!-- CINEMATIC HERO -->
    <section class="min-h-screen flex items-center relative overflow-hidden bg-[#0F172A]">
        <div class="absolute inset-0 bg-[radial-gradient(#0EA5E9_0.5px,transparent_1px)] [background-size:40px_40px] opacity-10"></div>
        <div class="max-w-5xl mx-auto px-6 text-center relative z-10">
            <!-- New Chapter Header -->
            <div class="inline-flex items-center gap-2 px-6 py-2.5 rounded-3xl bg-white/10 backdrop-blur-md border border-white/20 mb-8">
                <i class="fa-solid fa-palette text-[#93C5FD] text-xl"></i>
                <span class="uppercase tracking-[3px] text-xs font-mono text-white/90">CHAPTER 04 • SELECTED WORK</span>
            </div>
            <h1 class="text-7xl md:text-[120px] font-semibold tracking-tighter leading-[0.9] text-white section-heading mb-6">Crafting<br>digital<br>experiences</h1>
            <p class="max-w-xl mx-auto text-xl md:text-2xl text-white/70">A curated selection of design systems, AI interfaces, and enterprise platforms that push boundaries.</p>
            <div class="mt-12 flex justify-center gap-4">
                <a href="#projects" class="px-10 py-4 bg-white text-[#0F172A] font-semibold rounded-2xl hover:bg-[#0EA5E9] hover:text-white transition-all">Explore Projects</a>
            </div>
        </div>
        <div class="absolute bottom-12 left-1/2 -translate-x-1/2 animate-bounce">
            <i class="fa-solid fa-chevron-down text-white/60 text-3xl"></i>
        </div>
    </section>

    <!-- FILTERS -->
    <section class="sticky top-20 z-50 bg-white/95 backdrop-blur-lg border-b border-slate-200 py-6">
        <div class="max-w-6xl mx-auto px-6">
            <div class="flex flex-wrap gap-3 justify-center" id="filter-tabs">
                <button onclick="filterProjects('all')" class="filter-tab active px-8 py-3 rounded-3xl text-sm font-medium border border-slate-200">All Projects</button>
                <button onclick="filterProjects('design')" class="filter-tab px-8 py-3 rounded-3xl text-sm font-medium border border-slate-200">Design Systems</button>
                <button onclick="filterProjects('ai')" class="filter-tab px-8 py-3 rounded-3xl text-sm font-medium border border-slate-200">AI & Interfaces</button>
                <button onclick="filterProjects('enterprise')" class="filter-tab px-8 py-3 rounded-3xl text-sm font-medium border border-slate-200">Enterprise</button>
            </div>
        </div>
    </section>

    <!-- PROJECTS GRID -->
    <section id="projects" class="py-24">
        <div class="max-w-6xl mx-auto px-6">
            <div class="grid md:grid-cols-2 gap-8" id="projects-grid">
                <!-- Populated by JS -->
            </div>
        </div>
    </section>

    <script src="js/nav.js"></script>
    <script src="js/main.js"></script>

    <!-- PROJECT DATA & CAROUSELS -->
    <script>
        // Project data for grid
        const projects = [
            {
                id: 'raintree',
                category: 'design',
                title: 'Raintree 2021',
                subtitle: 'Comprehensive Design System',
                year: '2021',
                description: 'Scalable component library with interactive prototypes for consistent product experiences.',
                image: 'images/rt1.png',
                figma: 'https://www.figma.com/proto/pQ0XxN8DD7jAUaBbt39JAY/Design-portfolio?node-id=1-2',
                images: ['images/rt1.png','images/rt2.png','images/rt3.png','images/rt4.png','images/rt5.png','images/rt6.png','images/rt7.png','images/rt8.png','images/rt9.png','images/rt10.png','images/rt11.png']
            },
            {
                id: 'aiml',
                category: 'ai',
                title: 'AI/ML Interfaces',
                subtitle: 'Speculative UI Explorations',
                year: '2022',
                description: 'Intelligent interfaces, predictive interactions, and futuristic AI-driven experiences.',
                image: 'images/am (1).png',
                figma: 'https://www.figma.com/proto/pQ0XxN8DD7jAUaBbt39JAY/Design-portfolio?node-id=113-27212',
                images: ['images/am (1).png','images/am (2).png','images/am (3).png','images/am (4).png','images/am (5).png','images/am (6).png','images/am (7).png','images/am (8).png','images/am (9).png','images/am (10).png','images/am (11).png','images/am (12).png']
            },
            {
                id: 'identity',
                category: 'enterprise',
                title: 'Identity Service',
                subtitle: 'Enterprise Authentication',
                year: '2023',
                description: 'Secure identity management and complex B2B authentication flows.',
                image: 'images/is1.png',
                figma: 'https://www.figma.com/proto/pQ0XxN8DD7jAUaBbt39JAY/Design-portfolio?node-id=2139-203832',
                images: ['images/is1.png','images/is2.png','images/is3.png','images/is4.png','images/is5.png','images/is6.png','images/is7.png','images/is8.png','images/is9.png','images/is10.png','images/is11.png','images/is12.png']
            },
            {
                id: 'hcl',
                category: 'enterprise',
                title: 'HCL Commerce UI',
                subtitle: 'Navigation & Shell',
                year: '2024',
                description: 'Modern UI shell and navigation systems for B2B commerce platform.',
                image: 'images/hs (1).png',
                figma: 'https://www.figma.com/proto/pQ0XxN8DD7jAUaBbt39JAY/Design-portfolio?node-id=2133-87687',
                images: ['images/hs (1).png','images/hs (2).png','images/hs (3).png','images/hs (4).png','images/hs (5).png','images/hs (6).png','images/hs (7).png','images/hs (8).png','images/hs (9).png','images/hs (10).png']
            }
        ];

        function renderProjects(filteredProjects) {
            const grid = document.getElementById('projects-grid');
            grid.innerHTML = '';

            filteredProjects.forEach((proj, index) => {
                const cardHTML = `
                    <div class="project-card group bg-white rounded-3xl overflow-hidden border border-slate-100" data-category="${proj.category}">
                        <div class="relative">
                            <div class="carousel-container aspect-[16/10] cursor-pointer" onclick="openCarousel('${proj.id}')">
                                <img id="${proj.id}-thumb" src="${proj.image}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" alt="${proj.title}">
                                <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-all flex items-end p-8">
                                    <div class="text-white">
                                        <div class="text-xs tracking-widest uppercase mb-1">${proj.year}</div>
                                        <div class="text-2xl font-semibold">${proj.title}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="p-8">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <div class="text-sm uppercase tracking-widest text-[#0EA5E9]">${proj.subtitle}</div>
                                    <h3 class="text-3xl font-semibold tracking-tight mt-1 section-heading">${proj.title}</h3>
                                </div>
                                <a href="${proj.figma}" target="_blank" class="mt-1 px-6 py-3 bg-[#0EA5E9] text-white text-sm font-medium rounded-2xl hover:bg-sky-600 transition-all flex items-center gap-2">
                                    Figma <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                </a>
                            </div>
                            <p class="text-[#475569] leading-relaxed">${proj.description}</p>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        // Filter function
        window.filterProjects = function(category) {
            const tabs = document.querySelectorAll('#filter-tabs button');
            tabs.forEach(tab => tab.classList.remove('active'));
            event.currentTarget.classList.add('active');

            let filtered = projects;
            if (category !== 'all') {
                filtered = projects.filter(p => p.category === category);
            }
            renderProjects(filtered);
        };

        // Carousel modal (simple overlay with image cycling)
        let currentCarouselImages = [];
        let currentIndex = 0;
        let currentProjectId = '';

        window.openCarousel = function(projectId) {
            const proj = projects.find(p => p.id === projectId);
            if (!proj) return;

            currentCarouselImages = proj.images;
            currentIndex = 0;
            currentProjectId = projectId;

            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/95 z-[300] flex items-center justify-center p-6';
            modal.innerHTML = `
                <div class="max-w-5xl w-full relative">
                    <button onclick="this.closest('.fixed').remove()" class="absolute -top-4 -right-4 text-white text-5xl leading-none z-10">×</button>
                    <div class="carousel-container mx-auto">
                        <img id="modal-image" src="${currentCarouselImages[0]}" class="w-full h-auto max-h-[80vh] object-contain cursor-pointer" onclick="nextModalImage()">
                    </div>
                    <div class="text-center mt-6 text-white/80">
                        <span id="modal-counter">1 / ${currentCarouselImages.length}</span> — ${proj.title}
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            gsap.from(modal, {opacity: 0, scale: 0.95, duration: 0.4});
        };

        window.nextModalImage = function() {
            currentIndex = (currentIndex + 1) % currentCarouselImages.length;
            const img = document.getElementById('modal-image');
            const counter = document.getElementById('modal-counter');
            img.src = currentCarouselImages[currentIndex];
            counter.textContent = `${currentIndex + 1} / ${currentCarouselImages.length}`;
        };

        // Initialize everything
        document.addEventListener('DOMContentLoaded', () => {
            gsap.registerPlugin(ScrollTrigger);

            renderProjects(projects);

            // Hero animation
            gsap.from('.section-heading', {
                y: 80,
                opacity: 0,
                duration: 1.2,
                ease: 'power4.out'
            });

            // Scroll animations for cards
            gsap.utils.toArray('.project-card').forEach((card, i) => {
                gsap.from(card, {
                    y: 100,
                    opacity: 0,
                    duration: 0.8,
                    ease: 'power3.out',
                    scrollTrigger: {
                        trigger: card,
                        start: 'top 85%',
                        toggleActions: 'play none none reverse'
                    },
                    delay: i * 0.1
                });
            });
        });
    </script>
</body>
</html>
