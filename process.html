    <script>
    // Journey Line + Highlight
    function initJourneyLine() {
        const panels = document.querySelectorAll('.journey-panel');
        const progress = document.getElementById('journey-progress');
        const circles = document.querySelectorAll('.journey-circle');

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const stage = parseInt(entry.target.dataset.stage);
                    const percentage = (stage - 1) * 20 + 5; // 5%, 25%, 45%, etc.
                    progress.style.width = percentage + '%';

                    circles.forEach(circle => {
                        if (parseInt(circle.dataset.circle) === stage) {
                            circle.classList.add('border-emerald-400', 'text-emerald-400');
                            circle.classList.remove('border-white/30', 'text-white/50');
                        } else {
                            circle.classList.remove('border-emerald-400', 'text-emerald-400');
                            circle.classList.add('border-white/30', 'text-white/50');
                        }
                    });
                }
            });
        }, { threshold: 0.5, rootMargin: "-20% 0px" });

        panels.forEach(panel => observer.observe(panel));
    }

    window.addEventListener('load', initJourneyLine);
    </script>
